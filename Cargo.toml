[package]
name = "elotracker"
version = "1.0.0"
authors = ["Ch0p5h0p"]
description = "Elo-based ranking tracker"
license = "MIT"
repository = "https://github.com/Ch0p5h0p/EloTracker"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }

